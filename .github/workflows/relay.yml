name: Relay to the game

# Asks the private game repo to validate a pull request (when "Content checks"
# has passed on it) or to bump the lock (on a push to main). This is the only
# place a content repo holds a key: the App key of the relay, stored in the
# `relay` environment, which deploys from main only. The key can do one thing:
# start a workflow in the game repo (actions: write on that one repo).
# No checkout: nothing from the pull request is ever read or run here. Every
# value reaches the script through env: and is checked there.
# Generated by the game repo's kit (content.py kit); edits here are overwritten.

on:
  workflow_run:
    workflows: ["Content checks"]
    types: [completed]
  push:
    branches: [main]

permissions: {}

jobs:
  relay:
    name: Relay
    runs-on: ubuntu-latest
    environment: relay
    timeout-minutes: 5
    steps:
      - id: ev
        name: Read the event
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_BASE: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          PUSH_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          export LC_ALL=C
          set -euo pipefail
          bad=0
          if ! [[ "$REPO_NAME" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "::error::the repo name is not a repo name"
            bad=1
          fi
          if [ -n "$PR" ] && ! [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::the pull request number is not a number"
            bad=1
          fi
          if [ -n "$HEAD" ] && ! [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the head commit is not a full SHA"
            bad=1
          fi
          if [ -n "$PUSH_SHA" ] && ! [[ "$PUSH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the pushed commit is not a full SHA"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

          what=skip
          sha=""
          if [ "$EVENT_NAME" = "push" ]; then
            what=bump
            sha="$PUSH_SHA"
          elif [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "skip: unexpected event $EVENT_NAME"
          elif [ "$WR_EVENT" != "pull_request" ]; then
            echo "skip: Content checks ran on a $WR_EVENT, not a pull request"
          elif [ "$WR_HEAD_REPO" != "$THIS_REPO" ]; then
            echo "skip: the run is of a branch in $WR_HEAD_REPO, not in $THIS_REPO"
          elif [ "$WR_CONCLUSION" != "success" ]; then
            echo "skip: Content checks $WR_CONCLUSION: nothing to validate"
          elif [ -z "$PR" ]; then
            echo "skip: fork PR: no PR number in the event"
          elif [ "$PR_BASE" != "main" ]; then
            echo "skip: the pull request does not target main"
          else
            what=validate
            sha="$HEAD"
          fi

          if [ "$what" != "skip" ] && [ -z "$sha" ]; then
            echo "::error::no commit to hand over"
            exit 1
          fi
          {
            echo "what=$what"
            if [ "$what" = "validate" ]; then
              echo "pr=$PR"
            fi
            if [ "$what" != "skip" ]; then
              echo "sha=$sha"
            fi
          } >> "$GITHUB_OUTPUT"

      - id: token
        if: steps.ev.outputs.what != 'skip'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GAME_RELAY_APP_ID }}
          private-key: ${{ secrets.GAME_RELAY_KEY }}
          owner: ${{ vars.GAME_OWNER }}
          repositories: ${{ vars.GAME_REPO }}
          permission-actions: write

      - name: Start the workflow in the game repo
        if: steps.ev.outputs.what != 'skip'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GAME_OWNER: ${{ vars.GAME_OWNER }}
          GAME_REPO: ${{ vars.GAME_REPO }}
          WHAT: ${{ steps.ev.outputs.what }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR: ${{ steps.ev.outputs.pr }}
          SHA: ${{ steps.ev.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$WHAT" = "validate" ]; then
            gh workflow run validate-content.yml -R "$GAME_OWNER/$GAME_REPO" --ref main \
              -f repo="$REPO_NAME" -f pr="$PR" -f sha="$SHA"
          else
            gh workflow run content-bump.yml -R "$GAME_OWNER/$GAME_REPO" --ref main \
              -f repo="$REPO_NAME" -f sha="$SHA"
          fi
