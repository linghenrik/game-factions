name: Content checks

# Runs pack-tools/check_repo.py on every pull request to main and every push to
# main: the repo rules (Git LFS, no .import files, no .lfsconfig), the lint of
# every pack, and a change summary in the job summary. No secrets and a
# read-only token. LFS files are never downloaded: the checks read the small
# pointer files git keeps in their place.
# Generated by the game repo's kit (content.py kit); edits here are overwritten.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Content checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      # uv installs Python 3.12 itself, so no setup-python.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Check the repo and every pack
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--ci)
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            args+=(--base "$BASE")
          fi
          uv run pack-tools/check_repo.py "${args[@]}"
